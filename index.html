<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e14; --surface: #111722; --surface2: #1a2332; --border: #1f2937;
  --text: #e5e7eb; --muted: #6b7280; --accent: #00d4ff; --accent2: #a78bfa;
  --green: #34d399; --red: #ef4444; --orange: #fb923c; --yellow: #fbbf24;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 32px 24px; line-height: 1.6; }
.wrap { max-width: 880px; margin: 0 auto; }
.hdr { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
.hdr h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.hdr .sub { font-size: 12px; color: var(--muted); }
.input-row { display: flex; gap: 8px; margin-bottom: 16px; }
input[type=text] {
  flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font-family: 'Inter', sans-serif; font-size: 16px;
  padding: 14px 16px; outline: none;
}
@media (max-width: 600px) {
  body { padding: 20px 14px; }
  .hdr { margin-bottom: 20px; }
  .hdr h1 { font-size: 19px; }
  .input-row { gap: 6px; }
  button { padding: 0 16px; font-size: 13px; }
  .output { padding: 18px 16px; }
  .saved-item .si-ts { display: none; }
}
input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,255,0.1); }
button {
  background: var(--accent); color: #0a0e14; border: none; border-radius: 8px;
  font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700;
  padding: 0 24px; cursor: pointer; transition: opacity 0.15s; letter-spacing: 0.5px;
}
button:hover { opacity: 0.85; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.ghost { background: var(--surface); color: var(--muted); border: 1px solid var(--border); padding: 6px 12px; font-size: 11px; font-weight: 500; }
button.ghost:hover { color: var(--accent); border-color: var(--accent); opacity: 1; }
.mode-pill {
  display: inline-block; padding: 2px 9px; font-size: 10px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase; border-radius: 12px;
  border: 1px solid; margin-bottom: 14px;
}
.mode-ticker { color: var(--green); border-color: rgba(52,211,153,0.4); background: rgba(52,211,153,0.08); }
.mode-topic  { color: var(--accent2); border-color: rgba(167,139,250,0.4); background: rgba(167,139,250,0.08); }
.recent { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; min-height: 24px; }
.recent-tag {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 4px 11px; font-family: 'JetBrains Mono', monospace; font-size: 11px;
  color: var(--muted); cursor: pointer; transition: all 0.15s; max-width: 240px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.recent-tag:hover { color: var(--accent); border-color: var(--accent); }
.saved-section {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 18px; margin-bottom: 24px;
}
.saved-section .saved-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
  font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px;
}
.saved-list { display: flex; flex-direction: column; gap: 4px; }
.saved-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 10px; border-radius: 6px; cursor: pointer; transition: background 0.15s;
  border: 1px solid transparent;
}
.saved-item:hover { background: var(--surface2); border-color: var(--border); }
.saved-item .si-subj { font-size: 13px; color: var(--text); font-weight: 500; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.saved-item .si-ts   { font-size: 10px; color: var(--muted); margin: 0 12px; flex-shrink: 0; }
.saved-item .si-act  { background: none; border: none; color: var(--muted); padding: 2px 6px; cursor: pointer; font-size: 14px; flex-shrink: 0; }
.saved-item .si-act.si-refresh:hover { color: var(--accent); }
.saved-item .si-act.si-del:hover { color: var(--red); }
.status { font-size: 12px; color: var(--muted); margin-bottom: 12px; min-height: 16px; }
.status.error { color: var(--red); }
.output-wrap { display: none; }
.output-wrap.show { display: block; }
.output-bar {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
  font-size: 11px; color: var(--muted); padding: 0 4px;
}
.output {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 24px 28px; font-size: 14px; line-height: 1.85;
}
.output h1, .output h2, .output h3 { font-family: 'Inter', sans-serif; font-weight: 700; margin-top: 18px; margin-bottom: 8px; color: var(--accent); }
.output h1 { font-size: 18px; }
.output h2 { font-size: 16px; }
.output h3 { font-size: 14px; color: var(--accent2); }
.output strong { color: var(--text); font-weight: 700; }
.output em { color: var(--yellow); font-style: normal; }
.output ul, .output ol { padding-left: 22px; margin: 8px 0; }
.output li { margin-bottom: 4px; }
.output a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); }
.output a:hover { border-bottom-style: solid; }
.output p { margin: 6px 0; }
.sources {
  margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border);
}
.sources-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.source-item { font-size: 12px; margin-bottom: 6px; padding-left: 14px; position: relative; }
.source-item::before { content: '→'; position: absolute; left: 0; color: var(--accent); }
.source-item a { color: var(--text); text-decoration: none; }
.source-item a:hover { color: var(--accent); }
.source-item .src-host { color: var(--muted); font-size: 11px; margin-left: 6px; }
.spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -1px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.foot { margin-top: 28px; font-size: 11px; color: var(--muted); text-align: center; }
</style>
</head>
<body>

<div class="wrap">

  <div class="hdr">
    <div style="font-size:24px;">🔬</div>
    <div>
      <h1>Research</h1>
      <div class="sub">Tickers, topics, anything — live web search via Claude</div>
    </div>
  </div>

  <div class="input-row">
    <input type="text" id="subjectInput" placeholder="Ticker (NVDA), topic (AI infrastructure spend), event, person…" autocomplete="off">
    <button id="researchBtn" onclick="runResearch()">RESEARCH</button>
  </div>

  <div class="recent" id="recentTags"></div>

  <div class="saved-section" id="savedSection" style="display:none;">
    <div class="saved-header">
      <span>★ Saved (<span id="savedCount">0</span>)</span>
      <button class="ghost" onclick="clearSaved()">Clear all</button>
    </div>
    <div class="saved-list" id="savedList"></div>
  </div>

  <div class="status" id="status"></div>

  <div class="output-wrap" id="outputWrap">
    <div class="output-bar">
      <span id="outputMeta"></span>
      <span style="display:flex;gap:6px;">
        <button class="ghost" id="refreshBtn" onclick="refreshCurrent()" title="Re-search with fresh web data">↻ Refresh</button>
        <button class="ghost" id="saveBtn" onclick="saveCurrent()">★ Save</button>
      </span>
    </div>
    <div class="output" id="output"></div>
  </div>

  <div class="foot">
    Calls Claude with web_search via the RollWatch proxy. Output reflects live web sources.
  </div>

</div>

<script>
'use strict';

const PROXY_URL = 'https://script.google.com/macros/s/AKfycbx6bii9j6bTsTQCK4QT5-zF4XGVRygiYdqExdb0QbFQJqu__l-gLjBr8gRUyGpZzAziow/exec';

let recent = [];
let saved = [];
let currentResult = null; // { subject, kind, text, sources, ts }
let autoSaveAfterRun = false; // set by refreshSaved so the fresh result overwrites the saved entry

window.addEventListener('DOMContentLoaded', () => {
  try { recent = JSON.parse(localStorage.getItem('tr_recent') || '[]'); } catch(e) { recent = []; }
  try { saved  = JSON.parse(localStorage.getItem('tr_saved')  || '[]'); } catch(e) { saved  = []; }
  renderRecent();
  renderSaved();
  document.getElementById('subjectInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') runResearch();
  });
  document.getElementById('subjectInput').focus();
});

function detectKind(subject) {
  // Ticker = 1-6 chars, all uppercase letters with optional . or - (BRK.B, RDS-A)
  if (/^[A-Z]{1,6}([.\-][A-Z]{1,2})?$/.test(subject.trim())) return 'ticker';
  return 'topic';
}

function renderRecent() {
  const el = document.getElementById('recentTags');
  if (!recent.length) { el.innerHTML = ''; return; }
  el.innerHTML = recent.map(r => `<span class="recent-tag" onclick="loadSubject(${JSON.stringify(r).replace(/"/g, '&quot;')})">${esc(r)}</span>`).join('');
}

function renderSaved() {
  const sec = document.getElementById('savedSection');
  const list = document.getElementById('savedList');
  document.getElementById('savedCount').textContent = saved.length;
  if (!saved.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  list.innerHTML = saved.map((s, i) => {
    const dt = new Date(s.ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    return `<div class="saved-item" onclick="loadSaved(${i})">
      <span class="si-subj">${esc(s.subject)}</span>
      <span class="si-ts">${dt}</span>
      <button class="si-act si-refresh" onclick="event.stopPropagation();refreshSaved(${i})" title="Re-search with fresh web data">↻</button>
      <button class="si-act si-del" onclick="event.stopPropagation();deleteSaved(${i})" title="Remove">✕</button>
    </div>`;
  }).join('');
}

function loadSubject(subj) {
  document.getElementById('subjectInput').value = subj;
  runResearch();
}

function loadSaved(i) {
  const s = saved[i]; if (!s) return;
  document.getElementById('subjectInput').value = s.subject;
  currentResult = s;
  renderResult(s);
}

function refreshSaved(i) {
  const s = saved[i]; if (!s) return;
  document.getElementById('subjectInput').value = s.subject;
  autoSaveAfterRun = true;
  runResearch();
}

function deleteSaved(i) {
  saved.splice(i, 1);
  localStorage.setItem('tr_saved', JSON.stringify(saved));
  renderSaved();
}

function clearSaved() {
  if (!confirm('Remove all saved research?')) return;
  saved = [];
  localStorage.setItem('tr_saved', JSON.stringify(saved));
  renderSaved();
}

function refreshCurrent() {
  if (!currentResult) return;
  document.getElementById('subjectInput').value = currentResult.subject;
  runResearch();
}

function saveCurrent() {
  if (!currentResult) return;
  // Avoid dupes: replace existing entry with same subject
  saved = saved.filter(s => s.subject !== currentResult.subject);
  saved.unshift({ ...currentResult, ts: Date.now() });
  saved = saved.slice(0, 50);
  localStorage.setItem('tr_saved', JSON.stringify(saved));
  renderSaved();
  document.getElementById('saveBtn').textContent = '★ Saved';
  setTimeout(() => { const b = document.getElementById('saveBtn'); if (b) b.textContent = '★ Save'; }, 1500);
}

function pushRecent(subj) {
  recent = [subj, ...recent.filter(x => x !== subj)].slice(0, 12);
  localStorage.setItem('tr_recent', JSON.stringify(recent));
  renderRecent();
}

function setStatus(msg, isError) {
  const el = document.getElementById('status');
  el.innerHTML = msg;
  el.className = 'status' + (isError ? ' error' : '');
}

function buildTickerPrompt(ticker) {
  return `You are a NEWS-focused research analyst for an active options trader. Use the web_search tool aggressively. The user wants what's happening RIGHT NOW, not history.

TICKER: ${ticker}

Hard rules:
- Prefer items dated in the LAST 7 DAYS. Items 7-30 days old only if directly material to current price action.
- Items from the LAST 72 HOURS are gold — lead the headlines section with them and prefix each with "🔥 " so they stand out.
- EXCLUDE evergreen explanations, "what is [company]", educational pieces, and generic primers.
- EXCLUDE training-data context unless it directly explains a current event.
- Every news bullet MUST include a date (e.g. "Nov 14") and an inline source link.

Output in markdown. Skip generic disclaimers. Skip company background.

## One-Line Snapshot
One sentence: the dominant narrative moving the stock this week.

## This Week's Headlines
5-8 bullets, sorted newest first. Last-72-hour items lead the list with "🔥 " prefix. Format: **[Date]** — headline, with inline [source](url). One sentence max per bullet.

## Active Catalysts (next 30 days)
Dated upcoming events only: earnings, product launches, regulatory decisions, court rulings, expiring lockups. Skip if nothing dated.

## Live Analyst Action (last 30 days)
Recent rating changes, price target moves, or notable upgrades/downgrades. Format: **[Date]** — Firm, action. Skip section if nothing fresh.

If the last 7 days are quiet, say so explicitly. Do not pad with older material.`;
}

function buildTopicPrompt(topic) {
  return `You are a NEWS curator. The user wants what's happening RIGHT NOW on this subject — not background, not explainers, not history. Use the web_search tool aggressively.

SUBJECT: ${topic}

Hard rules:
- Prefer items dated in the LAST 7 DAYS. Items 7-30 days old only if they're still actively driving the conversation.
- Items from the LAST 72 HOURS are gold — lead the developments section with them and prefix each with "🔥 " so they stand out.
- EXCLUDE evergreen explainers, "what is X" content, primers, and overviews.
- EXCLUDE training-data context unless it directly frames a current event.
- Every item MUST include a date and an inline source link.
- Prefer primary sources, reporting, and authoritative voices over SEO aggregators.

Output in markdown. Skip generic disclaimers.

## One-Line Snapshot
One sentence: the dominant story on this subject this week.

## This Week's Developments
5-8 bullets, sorted newest first. Last-72-hour items lead the list with "🔥 " prefix. Format: **[Date]** — what happened, with inline [source](url). One sentence max per bullet.

## Worth Reading Now
5-8 recent (last 30 days max) articles/posts/papers. For each:
- **[Date · Title](URL)** — one sentence on the new angle or finding it brings. Skip pieces that just summarize the news.

## What to Watch Next 7-14 Days
Upcoming dated events, expected announcements, catalysts on the calendar. Skip if nothing dated.

If the last 7 days are quiet on this subject, say so explicitly. Do not pad with older material.`;
}

async function runResearch() {
  const subject = document.getElementById('subjectInput').value.trim();
  if (!subject) { setStatus('Enter a ticker, topic, or anything you want researched', true); return; }

  const kind = detectKind(subject);
  const prompt = kind === 'ticker' ? buildTickerPrompt(subject.toUpperCase()) : buildTopicPrompt(subject);
  const displaySubject = kind === 'ticker' ? subject.toUpperCase() : subject;

  const btn = document.getElementById('researchBtn');
  const wrap = document.getElementById('outputWrap');
  btn.disabled = true;
  wrap.classList.remove('show');
  setStatus(`<span class="spinner"></span> Researching <strong>${esc(displaySubject)}</strong> with web search… (15-45s)`, false);

  try {
    const resp = await fetch(PROXY_URL + '?action=research', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'prompt=' + encodeURIComponent(prompt)
    });
    const data = await resp.json();
    if (data.error) throw new Error(typeof data.error === 'string' ? data.error : data.error.message || 'API error');
    if (data.type === 'error') throw new Error(data.error?.message || 'API error');

    // Extract text + collect web search result URLs from tool_result blocks
    const blocks = data.content || [];
    const text = blocks.filter(b => b.type === 'text').map(b => b.text).join('\n\n');
    const sources = [];
    const seen = new Set();
    blocks.forEach(b => {
      if (b.type === 'web_search_tool_result' && Array.isArray(b.content)) {
        b.content.forEach(r => {
          if (r.type === 'web_search_result' && r.url && !seen.has(r.url)) {
            seen.add(r.url);
            sources.push({ url: r.url, title: r.title || r.url, page_age: r.page_age });
          }
        });
      }
    });
    if (!text) throw new Error('Empty response');

    currentResult = { subject: displaySubject, kind, text, sources, ts: Date.now() };
    renderResult(currentResult);
    setStatus(`Generated ${new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })} · ${displaySubject}${sources.length ? ' · ' + sources.length + ' sources' : ''}`, false);
    pushRecent(displaySubject);
    if (autoSaveAfterRun) { saveCurrent(); }
  } catch(e) {
    setStatus('Failed: ' + esc(e.message), true);
    console.error('[research]', e);
  } finally {
    btn.disabled = false;
    autoSaveAfterRun = false;
  }
}

function renderResult(r) {
  const out = document.getElementById('output');
  const meta = document.getElementById('outputMeta');
  const wrap = document.getElementById('outputWrap');
  const saveBtn = document.getElementById('saveBtn');

  const pillClass = r.kind === 'ticker' ? 'mode-ticker' : 'mode-topic';
  const pillText  = r.kind === 'ticker' ? 'TICKER' : 'TOPIC';
  meta.innerHTML = `<span class="mode-pill ${pillClass}" style="margin-bottom:0">${pillText}</span> · ${esc(r.subject)} · ${new Date(r.ts).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}`;

  let html = renderMarkdown(r.text);
  if (r.sources && r.sources.length) {
    html += '<div class="sources"><div class="sources-label">Web sources cited</div>'
      + r.sources.map(s => {
        let host = ''; try { host = new URL(s.url).hostname.replace(/^www\./, ''); } catch(e) {}
        return `<div class="source-item"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a><span class="src-host">${esc(host)}</span></div>`;
      }).join('')
      + '</div>';
  }
  out.innerHTML = html;
  wrap.classList.add('show');

  // Reset save button state — show "Saved" if already in saved list
  const isSaved = saved.some(s => s.subject === r.subject);
  saveBtn.textContent = isSaved ? '★ Saved' : '★ Save';
}

// Minimal markdown → HTML: headings, bold, italics, lists, [text](url) links.
function renderMarkdown(md) {
  const lines = md.split('\n');
  let html = '';
  let inList = false;
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];
    const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
    if (/^### /.test(line)) { closeList(); html += `<h3>${inline(esc(line.slice(4)))}</h3>`; continue; }
    if (/^## /.test(line))  { closeList(); html += `<h2>${inline(esc(line.slice(3)))}</h2>`; continue; }
    if (/^# /.test(line))   { closeList(); html += `<h1>${inline(esc(line.slice(2)))}</h1>`; continue; }
    if (/^[-*]\s/.test(line)) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inline(esc(line.replace(/^[-*]\s/, '')))}</li>`;
      continue;
    }
    closeList();
    if (line.trim() === '') { html += ''; continue; }
    html += `<p>${inline(esc(line))}</p>`;
  }
  if (inList) html += '</ul>';
  return html;
}
function inline(s) {
  return s
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(?<![*])\*([^*]+)\*(?![*])/g, '<em>$1</em>');
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>

</body>
</html>
